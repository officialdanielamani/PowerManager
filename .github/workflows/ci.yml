name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ESP32_CORE: "3.3.5"
  ARDUINOJSON_VERSION: "7.1.0"
  WEBSOCKETS_VERSION: "2.7.2"

jobs:
  server:
    name: Server tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]   # 3.11 = the Docker image
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: server/requirements*.txt
      - run: pip install -r server/requirements-dev.txt
      - name: pytest
        working-directory: server
        run: python -m pytest -q

  firmware-host:
    name: Firmware PC tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: server/requirements*.txt
      - run: pip install -r server/requirements-dev.txt
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends g++ libssl-dev
      - name: Shared files, AUX automation, MQTT link
        run: firmware/tools/host_tests.sh

  firmware-build:
    name: Firmware ${{ matrix.sketch }} (${{ matrix.variant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { sketch: PowerMeterPZEM, variant: default }
          - { sketch: PowerMeterPZEM, variant: dc }
          - { sketch: PowerMeterPZEM, variant: mqtt-only }
          - { sketch: PowerMeterRBAmp, variant: default }
          - { sketch: PowerMeterRBAmp, variant: example }
          - { sketch: PowerMeterRBAmp, variant: all-parts }
          - { sketch: PowerMeterRBAmp, variant: ws-only }
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15
            ~/Arduino/libraries
          key: arduino-esp32-${{ env.ESP32_CORE }}-aj${{ env.ARDUINOJSON_VERSION }}-ws${{ env.WEBSOCKETS_VERSION }}
      - name: Board package and libraries
        run: firmware/tools/setup_arduino.sh
      - name: Compile
        run: firmware/tools/build.sh ${{ matrix.sketch }} ${{ matrix.variant }}
      - uses: actions/upload-artifact@v4
        if: matrix.variant == 'default'
        with:
          name: ${{ matrix.sketch }}-default-config
          path: firmware/build/${{ matrix.sketch }}-default/*.bin
          retention-days: 14

  docker:
    name: Docker image builds and starts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t powermanager:ci server
      - name: Start and wait for /healthz
        run: |
          docker run -d --name pm -p 5000:5000 powermanager:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:5000/healthz && exit 0
            sleep 2
          done
          docker logs pm
          exit 1
